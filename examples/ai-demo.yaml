name: ai-demo
task: |
  Demonstrate one AI-backed Suzumio activation. The agent should send a short status message to the user.

backend:
  kind: docker-chat
  image: suzumio-runner:dev
  controllerUrl: http://host.docker.internal:39400
  runner:
    mode: ai
    model: main-with-fallback
    models:
      providers:
        gateway:
          type: openai-compatible
          baseURL: https://your-gateway.example/v1
          apiKeyEnv: SUZUMIO_GATEWAY_API_KEY
          timeoutMs: 300000
      presets:
        main:
          provider: gateway
          model: gpt-5.5
          reasoningEffort: low
          maxOutputTokens: 2000
          contextLimit: 260000
          toolChoice: auto
        main-with-fallback:
          model-list:
            - main

tools:
  toolpacks:
    - core

agents:
  pm:
    role: project-manager
    displayName: Yuki
    model: main-with-fallback
    prompt: |
      You are a concise project manager. Send one short status update to the user using messages.send.
    tools:
      - messages.send
      - coordination.wait_for_signal

channels:
  - "#project"

observability:
  http:
    enabled: true
    host: 127.0.0.1
    port: 39400
  webui:
    enabled: true
