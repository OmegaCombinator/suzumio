name: e2e-ramsey-explore
task: |
  Explore Ramsey number bounds as a multi-agent collaboration exercise.

  This demo is intentionally not a record-hunting benchmark. Pick a few approachable targets such as R(3,3), R(3,4), R(4,4), R(3,5), or another small pair if justified. The goal is to expose collaboration behavior: how agents divide routes, report partial derivations, critique claims, and converge to a conservative research note.

  The final report should separate known or textbook facts, derivations reproduced by the team, speculative leads, failed attempts, and next experiments. Do not claim a new bound unless the proof or construction is actually included.

backend:
  kind: docker-chat
  image: suzumio-runner:dev
  controllerUrl: ${SUZUMIO_CONTROLLER_URL}
  docker:
    network: host
    proxy:
      inheritEnv: true
      rewriteLocalhost: false
      http: ${HTTP_PROXY}
      https: ${HTTPS_PROXY}
      all: ${ALL_PROXY}
      noProxy: ${NO_PROXY}
    mounts: []
  runner:
    mode: ai
    model: explorer
    models:
      providers:
        gateway:
          type: openai-compatible
          apiKeyEnv: SUZUMIO_GATEWAY_API_KEY
          baseURL: ${SUZUMIO_GATEWAY_BASE_URL}
          timeoutMs: 300000
      presets:
        explorer:
          provider: gateway
          model: gpt-5.5
          maxOutputTokens: 32000
          temperature: 0.55
          toolChoice: auto
        critic:
          provider: gateway
          model: gpt-5.5
          maxOutputTokens: 32000
          temperature: 0.2
          toolChoice: auto

agents:
  pm:
    role: research-coordinator
    displayName: Yuki
    model: explorer
    prompt: |
      Coordinate a lightweight Ramsey exploration toward a conservative final summary.
      Use the researchers and critic for substantive exploration and review rather than producing the whole report alone.
      Keep enough state to compare targets, bounds, evidence quality, confidence, and open gaps.
      Treat requests you send to other agents as outstanding until you have seen their response or explicitly superseded the request.
      If you have sent the useful requests and are waiting for replies, call coordination.wait_for_signal.
    tools:
      - messages.send
      - coordination.wait_for_signal
      - completion.submit
  researcher:
    role: ramsey-researcher
    names: [Akari, Ren, Sora]
    count: 3
    model: explorer
    prompt: |
      Explore Ramsey bounds in your assigned direction. Prefer small examples where you can show a proof sketch, construction idea, executable search result, or honest failure.
      Use shell.exec with Python for small finite experiments when that would test a construction or recurrence. Use web.fetch only for lightweight fact checks; cite uncertainty if a source cannot be checked.
      Send pm the most useful result you have, including enough support and uncertainty for critic review. If you have reported your result and are waiting for follow-up, call coordination.wait_for_signal with notifyPm:false.
    tools:
      - messages.send
      - coordination.wait_for_signal
      - shell.exec
      - web.fetch
  critic:
    role: research-critic
    displayName: Mio
    model: critic
    prompt: |
      Review Ramsey claims for hallucinated exact values, unsupported improvements, and invalid monotonicity or recursion use. Send pm an ACCEPT/REVISE verdict and a cleaned table of claims that are safe to include.

      Prefer a conservative final table over asking for open-ended more research.
    tools:
      - messages.send
      - coordination.wait_for_signal
      - web.fetch

channels:
  - "#project"
  - "#blocked"
tools:
  toolpacks:
    - core
    - shell
    - web
observability:
  http:
    enabled: true
    host: 127.0.0.1
    port: 39400
  webui:
    enabled: true
