name: e2e-square-proof
task: |
  Prove the following mathematical statement and produce a final checked proof:

  If five closed unit squares with pairwise-disjoint interiors are placed inside a larger square, then the side length of the larger square is at least 2 + sqrt(2)/2.

  Treat this as a serious proof task. The final answer should clearly state assumptions, identify any geometric lemmas used, and avoid handwaving. If the team cannot close the proof, submit a gap report instead of pretending success.

  Suggested route to investigate carefully: for L < 2 + sqrt(2)/2, set d = L - 2 and choose epsilon > 0 with e = d/2 + epsilon < 1/(2 sqrt(2)). In coordinates centered at the large square, consider the four points (+/-e, +/-e), equivalently near (1,1), (L-1,1), (1,L-1), (L-1,L-1) but epsilon-shifted so that interior containment may hold. Determine whether every unit square contained in the large square must contain one of these four points in its interior. If this exact epsilon-shifted piercing lemma is true, the pigeonhole principle proves the lower bound. If it is false, give a concrete counterexample to the exact shifted statement, not merely to the unshifted boundary-anchor version.

backend:
  kind: docker-chat
  image: suzumio-runner:dev
  controllerUrl: ${SUZUMIO_CONTROLLER_URL}
  docker:
    mounts: []
  runner:
    mode: ai
    model: main
    models:
      providers:
        gateway:
          type: openai-compatible
          apiKeyEnv: SUZUMIO_GATEWAY_API_KEY
          baseURLEnv: SUZUMIO_GATEWAY_BASE_URL
          timeoutMs: 300000
      presets:
        main:
          provider: gateway
          model: gpt-5.5
          maxOutputTokens: 32000
          temperature: 0.2
          toolChoice: auto
        checker-model:
          provider: gateway
          model: gpt-5.5
          maxOutputTokens: 32000
          temperature: 0.1
          toolChoice: auto

agents:
  pm:
    role: project-manager
    displayName: Yuki
    model: main
    prompt: |
      Coordinate a small proof team toward a checked proof or an honest gap report.
      Use the workers and checker for the substantive mathematical work instead of trying to solve the whole theorem alone.
      Keep enough state to compare competing claims, request critique when a candidate proof is ready, and submit only when the team evidence supports the final report.
      Treat requests you send to other agents as outstanding until you have seen their response or explicitly superseded the request.
      If you have sent the useful requests and are waiting for replies, call coordination.wait_for_signal.
    tools:
      - messages.send
      - coordination.wait_for_signal
      - completion.submit
  worker:
    role: proof-worker
    names: [Akari, Ren]
    count: 2
    model: main
    prompt: |
      Work on the mathematical request you receive. Send pm a rigorous proof, a concrete counterexample, or the smallest precise gap you find.
      Be explicit about geometric lemmas, arbitrary orientations, strict interior versus boundary containment, and where the constant 2 + sqrt(2)/2 enters.
      Do not claim a proof if a step is only plausible. If you have reported your result and are waiting for follow-up, call coordination.wait_for_signal with notifyPm:false.
    tools:
      - messages.send
      - coordination.wait_for_signal
  checker:
    role: proof-checker
    displayName: Mio
    model: checker-model
    prompt: |
      You are the adversarial proof checker. Review worker/PM arguments for hidden assumptions, invalid geometric inequalities, missing compactness cases, and misuse of disjoint interiors. Send pm a verdict: ACCEPT with a cleaned proof outline, or REJECT with the smallest concrete gap and suggested repair.
      If the proof is acceptable with local edits, provide the replacement text and mark it ACCEPT-with-edits.
      Treat similar-looking statements carefully, especially shifted interior-piercing claims versus unshifted boundary-anchor claims.
    tools:
      - messages.send
      - coordination.wait_for_signal

channels:
  - "#project"
  - "#blocked"
tools:
  toolpacks:
    - core
observability:
  http:
    enabled: true
    host: 127.0.0.1
    port: 39400
  webui:
    enabled: true
