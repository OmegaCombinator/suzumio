name: e2e-formal-languages
task: |
  Research the current state of major formal proof languages and systems: HOL, Isabelle, Lean, Rocq/Coq, Metamath, Mizar, and Acorn.

  Compare community activity, standard-library maturity, code/proof readability, proof engine characteristics, automation style, ecosystem tooling, and likely fit for AI-assisted formalization. Produce a balanced final report with citations or source URLs where possible.

scheduler:
  kind: nonpreemptive-signals
  intervalMs: 2000
  maxPromptMessages: 40

backend:
  kind: docker-chat
  image: suzumio-runner:dev
  controllerUrl: ${SUZUMIO_CONTROLLER_URL}
  docker:
    mounts: []
  runner:
    mode: ai
    model: researcher-model
    maxIterations: 80
    maxToolCalls: 240
    models:
      providers:
        gateway:
          type: openai-compatible
          apiKeyEnv: SUZUMIO_GATEWAY_API_KEY
          baseURL: ${SUZUMIO_GATEWAY_BASE_URL}
          timeoutMs: 300000
      presets:
        researcher-model:
          provider: gateway
          model: gpt-5.5
          apiModel: gpt-5.5
          maxOutputTokens: 32000
          temperature: 0.35
          toolChoice: auto
        synthesis-model:
          provider: gateway
          model: gpt-5.5
          apiModel: gpt-5.5
          maxOutputTokens: 32000
          temperature: 0.25
          toolChoice: auto

agents:
  pm:
    role: research-coordinator
    displayName: Yuki
    model: synthesis-model
    prompt: |
      Coordinate an evidence-based web research report.
      Use the researchers and factchecker for substantive research and review rather than producing the whole report alone.
      Track enough state to compare source quality, community activity, library completeness, readability, proof engine, automation, ecosystem, and AI-formalization fit.
      Treat requests you send to other agents as outstanding until you have seen their response or explicitly superseded the request.
      If you have sent the useful requests and are waiting for replies, call coordination.wait_for_signal.
    tools:
      - messages.send
      - coordination.wait_for_signal
      - completion.submit
      - web.fetch
  researcher:
    role: web-researcher
    names: [Akari, Ren, Sora]
    count: 3
    model: researcher-model
    prompt: |
      Research your assigned formal systems. Use web.fetch on official pages, GitHub repositories, docs, community pages, or release notes. Return an evidence-based report to pm with URLs and a confidence note for each claim. Avoid cheerleading; identify weaknesses and tradeoffs.
      If you have reported your result and are waiting for follow-up, call coordination.wait_for_signal with notifyPm:false.
    tools:
      - messages.send
      - coordination.wait_for_signal
      - web.fetch
  factchecker:
    role: fact-checker
    displayName: Mio
    model: synthesis-model
    prompt: |
      Check the report for stale facts, uncited claims, and unfair comparisons. Send pm a corrected comparison matrix and list any claims that should be softened or removed.

      Prefer a corrected publishable matrix over asking for open-ended more research.
    tools:
      - messages.send
      - coordination.wait_for_signal
      - web.fetch

channels:
  - "#project"
  - "#blocked"
tools:
  toolpacks:
    - core
    - web
observability:
  http:
    enabled: true
    host: 127.0.0.1
    port: 39400
  webui:
    enabled: true
