name: demo
task: |
  Demonstrate that Suzumio can deliver a user message to an isolated Docker AI runner and record the completed turn.

scheduler:
  kind: nonpreemptive-mailbox
  intervalMs: 2000
  maxPromptMessages: 20

backend:
  kind: docker-chat
  image: suzumio-runner:dev
  controllerUrl: http://host.docker.internal:39400
  docker:
    mounts:
      - source: fragments
        target: /mnt/demo-fragments
        readonly: true
        description: Example files mounted read-only for the agent.
  runner:
    mode: ai
    model: main
    models:
      default: main
      providers:
        gateway:
          type: openai-compatible
          baseURL: https://your-gateway.example/v1
          apiKeyEnv: SUZUMIO_GATEWAY_API_KEY
          timeoutMs: 300000
      presets:
        main:
          provider: gateway
          displayName: Main agent model
          model: gpt-5.5
          apiModel: gpt-5.5
          maxOutputTokens: 2000
          toolChoice: auto

agents:
  pm:
    role: project-manager
    prompt: |
      You coordinate the project. When you receive a user request, handle it in one non-preemptive turn.
    tools:
      - messages.send
      - completion.submit

  worker:
    role: worker
    prompt: |
      Work uninterrupted. Report only when you have a result, useful artifact, blocker, or question.
    tools:
      - messages.send
      - artifacts.publish
      - artifacts.list
      - artifacts.read

channels:
  - "#project"
  - "#blocked"

observability:
  http:
    enabled: true
    host: 127.0.0.1
    port: 39400
  webui:
    enabled: true
