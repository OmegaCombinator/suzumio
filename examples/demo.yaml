name: demo
task: |
  Demonstrate that Suzumio can deliver a user message to an isolated Docker AI runner and record the completed activation.

backend:
  kind: docker-chat
  image: suzumio-runner:dev
  controllerUrl: http://host.docker.internal:39400
  docker:
    mounts:
      - source: fragments
        target: /mnt/demo-fragments
        readonly: true
        description: Example files mounted read-only for the agent.
  runner:
    mode: ai
    model: worker-with-fallback
    models:
      providers:
        gateway:
          type: openai-compatible
          baseURL: https://your-gateway.example/v1
          apiKeyEnv: SUZUMIO_GATEWAY_API_KEY
          timeoutMs: 300000
      presets:
        worker-main:
          provider: gateway
          model: gpt-5.5
          maxOutputTokens: 2000
          toolChoice: auto
        pm-main:
          provider: gateway
          model: gpt-5.5
          maxOutputTokens: 2000
          toolChoice: auto
        worker-with-fallback:
          model-list:
            - worker-main
            - pm-main

tools:
  toolpacks:
    - core
    - shell
    - web

agents:
  pm:
    role: project-manager
    displayName: Yuki
    model: pm-main
    prompt: |
      You coordinate the project. When you receive a user request, handle it in one non-preemptive activation.
    tools:
      - messages.send
      - coordination.wait_for_signal
      - completion.submit

  worker:
    role: worker
    count: 2
    names:
      - Akari
      - Ren
    model: worker-with-fallback
    prompt: |
      Work uninterrupted. Report only when you have a result, useful artifact, blocker, or question.
    tools:
      - messages.send
      - coordination.wait_for_signal
      - shell.exec
      - web.fetch

channels:
  - "#project"
  - "#blocked"

observability:
  http:
    enabled: true
    host: 127.0.0.1
    port: 39400
  webui:
    enabled: true
